<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#12141f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="description" content="An Icy Tower-style vertical climber. Build speed, then convert it into height.">
    <title>TowerJumpGame</title>
    <style>
      :root { color-scheme: dark; }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #12141f;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #e8ecf8;
        /* The game reads its own touch input. Without this the browser claims drags for
           scrolling and pinches for zoom, and the on-screen pad stops responding mid-run. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #12141f;
        touch-action: none;
        outline: none;
      }

      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 24px;
        background: radial-gradient(circle at 50% 38%, #1d2135 0%, #12141f 68%);
        transition: opacity 420ms ease;
        z-index: 2;
      }

      #loader.done { opacity: 0; pointer-events: none; }

      #loader h1 {
        margin: 0;
        font-size: clamp(22px, 6vw, 38px);
        font-weight: 650;
        letter-spacing: 0.015em;
        text-align: center;
      }

      #bar {
        width: min(280px, 72vw);
        height: 6px;
        border-radius: 999px;
        background: #2b3047;
        overflow: hidden;
      }

      #bar > i {
        display: block;
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #5b8cff, #8f6dff);
        transition: width 220ms ease;
      }

      #hint { margin: 0; font-size: 13px; color: #8d95b2; text-align: center; }

      #error {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 28px;
        background: #12141f;
        text-align: center;
        z-index: 3;
      }

      #error p { margin: 0; max-width: 46ch; line-height: 1.5; }
      #error code {
        display: block;
        max-width: 90vw;
        overflow-x: auto;
        padding: 10px 12px;
        border-radius: 8px;
        background: #1b1f30;
        color: #ff9d9d;
        font-size: 12px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="loader">
      <h1>TowerJumpGame</h1>
      <div id="bar"><i></i></div>
      <p id="hint">Loading…</p>
    </div>

    <div id="error">
      <p id="error-text">This game could not start.</p>
      <code id="error-detail"></code>
    </div>

    <script src="Build/webgl.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loader = document.querySelector("#loader");
      var fill = document.querySelector("#bar > i");
      var hint = document.querySelector("#hint");

      function fail(message) {
        document.querySelector("#error").style.display = "flex";
        document.querySelector("#error-detail").textContent = message;
        loader.classList.add("done");
      }

      // Match the drawing buffer to the real pixels the canvas occupies. Without this the game
      // renders at the CSS size and is visibly soft on any high-DPI screen; capping the ratio
      // keeps a 3x phone from paying for nine times the fragments at no visible benefit.
      function resize() {
        var ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(canvas.clientWidth * ratio);
        canvas.height = Math.floor(canvas.clientHeight * ratio);
      }

      window.addEventListener("resize", resize);
      resize();

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/webgl.data.unityweb",
        frameworkUrl: "Build/webgl.framework.js.unityweb",
        codeUrl: "Build/webgl.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Mog",
        productName: "TowerJumpGame",
        productVersion: "1.0",
        matchWebGLToCanvasSize: false,
      }, function (progress) {
        fill.style.width = (progress * 100).toFixed(0) + "%";
        if (progress >= 1) { hint.textContent = "Starting…"; }
      }).then(function () {
        resize();
        loader.classList.add("done");
        setTimeout(function () { loader.style.display = "none"; }, 450);
        canvas.focus();
      }).catch(function (message) {
        fail(String(message));
      });

      // Keyboard play needs the canvas focused, and a click anywhere is the clearest way to say
      // so on desktop. Harmless on touch, where the game takes the same event as input.
      window.addEventListener("pointerdown", function () { canvas.focus(); });
    </script>
  </body>
</html>
